<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STCB Bank</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
box-sizing:border-box;
font-family:Segoe UI,Arial;
}

body{
margin:0;
background:#050914;
color:white;
}


#login{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}


.box{

width:380px;
max-width:90%;
background:#101c32;
padding:35px;
border-radius:25px;
border:1px solid #20385d;
box-shadow:0 20px 60px #000;

}


.logo{
font-size:70px;
text-align:center;
}


h1{
color:#00c8ff;
}


input{

width:100%;
padding:14px;
margin-top:12px;
background:#050b16;
color:white;
border:1px solid #29405f;
border-radius:15px;

}


button{

width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:15px;
background:linear-gradient(135deg,#006cff,#00c8ff);
color:white;
font-weight:bold;
cursor:pointer;

}



#bank{
display:none;
}



.header{

height:70px;
background:#081120;
padding:20px;
font-size:25px;
color:#00c8ff;

}



.nav{

display:flex;
gap:10px;
padding:10px;
background:#081120;

}


.nav button{

min-width:100px;
margin:0;

}



.page{

display:none;
padding:20px;

}


.page.active{

display:block;

}



.card{

background:#101c32;
border:1px solid #20385d;
border-radius:22px;
padding:25px;
margin-bottom:20px;

}



.money{

font-size:40px;
color:#00ff88;

}



#alerts{

position:fixed;
top:20px;
right:20px;

}



.alert{

background:#101c32;
border:1px solid #00c8ff;
padding:15px;
border-radius:15px;
margin-bottom:10px;

}


</style>

</head>


<body>


<div id="alerts"></div>


<div id="login">


<div class="box">


<div class="logo">
🏦
</div>


<h1>
STCB Bank
</h1>


<p>
Přihlášení klienta
</p>


<input id="name" placeholder="👤 Jméno">


<input id="pin" type="password" placeholder="🔐 PIN">


<button onclick="login()">
Přihlásit
</button>


<p id="loginMsg"></p>


</div>


</div>




<div id="bank">


<div class="header">
🏦 STCB Bank
</div>



<div class="nav">

<button onclick="openPage('home')">
🏠 Domů
</button>

<button onclick="openPage('send')">
💸 Poslat
</button>

<button onclick="openPage('qr')">
📷 QR
</button>

<button onclick="openPage('history')">
📜 Historie
</button>

<button onclick="openPage('profile')">
👤 Profil
</button>

</div>




<div id="home" class="page active">


<div class="card">

<h1>
Vítej 👋
</h1>


<h2 id="userName">
-
</h2>


<h2>
💰 Zůstatek
</h2>


<div id="balance" class="money">
0 Kč
</div>


</div>


</div>

<!-- PROFIL -->


<div id="profile" class="page">


<div class="card">


<h1>
👤 Profil
</h1>


<p>
Jméno:
<b id="profileName">
-
</b>
</p>


<p>
Účet:
<b id="profileAccount">
-
</b>
</p>


<button onclick="logout()">

🚪 Odhlásit

</button>


</div>


</div>





<script>


const supabaseClient = supabase.createClient(

"https://knpkaoddloxtzdtzwjle.supabase.co",

"sb_publishable_9hCQV5TfwR0VvoCPUJLiJQ_6ukPmXNr"

);



let currentClient=null;





function stcbAlert(text){


let box=document.createElement("div");


box.className="alert";


box.innerHTML=text;



document.getElementById("alerts")
.appendChild(box);



setTimeout(()=>{


box.remove();


},3000);


}








function openPage(id){


document.querySelectorAll(".page")

.forEach(page=>{


page.classList.remove("active");


});



document.getElementById(id)

.classList.add("active");


}








async function login(){



let name =
document.getElementById("name").value;


let pin =
document.getElementById("pin").value;



let msg =
document.getElementById("loginMsg");





if(!name || !pin){


msg.innerHTML="❌ Vyplň jméno a PIN";


return;


}






const {data,error}=await supabaseClient

.from("clients")

.select("*")

.eq("name",name)

.eq("pin",pin)

.single();






console.log(data,error);





if(error || !data){


msg.innerHTML="❌ Špatné jméno nebo PIN";


return;


}







currentClient=data;






document.getElementById("login")
.style.display="none";



document.getElementById("bank")
.style.display="block";






updateAccount();



}









function updateAccount(){



if(!currentClient)return;





document.getElementById("userName")

.innerHTML=currentClient.name;





document.getElementById("balance")

.innerHTML=

Number(currentClient.money)
.toLocaleString("cs-CZ")+" Kč";






document.getElementById("profileName")

.innerHTML=currentClient.name;






document.getElementById("profileAccount")

.innerHTML=

currentClient.account ||

"STCB-"+currentClient.id;



}









function logout(){



currentClient=null;



document.getElementById("bank")

.style.display="none";



document.getElementById("login")

.style.display="flex";



document.getElementById("name").value="";

document.getElementById("pin").value="";



}



</script>

<!-- POSÍLÁNÍ PENĚZ -->


<div id="send" class="page">


<div class="card">


<h1>
💸 Poslat peníze
</h1>



<input id="receiverName"
placeholder="👤 Jméno příjemce">



<input id="sendAmount"
type="number"
placeholder="💰 Částka Kč">



<button onclick="prepareSend()">

🔎 Pokračovat

</button>



<p id="sendMsg"></p>


</div>







<div id="sendConfirm" class="card" style="display:none;">


<h2>
🔐 Potvrzení platby
</h2>


<p id="sendInfo"></p>



<input id="sendPin"
type="password"
placeholder="🔐 Tvůj PIN">



<button onclick="finishSend()">

✅ Odeslat

</button>


</div>



</div>







<script>


let sendReceiver=null;

let sendAmount=0;







async function prepareSend(){



let name=
document.getElementById("receiverName").value;



let amount=
Number(document.getElementById("sendAmount").value);



let msg=
document.getElementById("sendMsg");






if(!name || amount<=0){


msg.innerHTML="❌ Vyplň jméno a částku";


return;


}







if(Number(currentClient.money)<amount){


msg.innerHTML="❌ Nemáš dost peněz";


return;


}







const {data,error}=await supabaseClient

.from("clients")

.select("*")

.eq("name",name)

.single();








if(error || !data){


msg.innerHTML="❌ Uživatel neexistuje";


return;


}







if(data.id===currentClient.id){


msg.innerHTML="❌ Nemůžeš poslat sám sobě";


return;


}








sendReceiver=data;

sendAmount=amount;








document.getElementById("sendInfo")

.innerHTML=

`

👤 Komu:
<b>${data.name}</b>

<br><br>

💰 Částka:
<b>${amount.toLocaleString("cs-CZ")} Kč</b>

`;








document.getElementById("sendConfirm")

.style.display="block";


}









async function finishSend(){



let pin=

document.getElementById("sendPin").value;








if(pin!==currentClient.pin){


stcbAlert("❌ Špatný PIN");


return;


}








if(Number(currentClient.money)<sendAmount){


stcbAlert("❌ Nemáš dost peněz");


return;


}







let date=

new Date().toLocaleString("cs-CZ");







currentClient.money=

Number(currentClient.money)-sendAmount;



sendReceiver.money=

Number(sendReceiver.money)+sendAmount;









await supabaseClient

.from("clients")

.update({

money:currentClient.money

})

.eq("id",currentClient.id);









await supabaseClient

.from("clients")

.update({

money:sendReceiver.money

})

.eq("id",sendReceiver.id);









await supabaseClient

.from("transfers")

.insert({

sender:currentClient.name,

receiver:sendReceiver.name,

amount:sendAmount,

date:date

});








stcbAlert("✅ Platba odeslána");



updateAccount();



document.getElementById("sendConfirm")

.style.display="none";


}



</script>

<!-- QR PLATBA -->


<div id="qr" class="page">


<div class="card">


<h1>
📷 QR Platba
</h1>


<p>
Namiř kameru na QR kód
</p>


<div id="qrReader"></div>


<p id="qrMsg"></p>


</div>







<div id="qrConfirm" class="card" style="display:none;">


<h2>
🔐 Potvrzení QR platby
</h2>


<p id="qrInfo"></p>


<input id="qrPin"
type="password"
placeholder="🔐 Tvůj PIN">



<button onclick="finishQR()">

✅ Zaplatit

</button>


</div>


</div>








<script>


let qrScanner=null;

let qrReceiver=null;

let qrAmount=0;

let qrRunning=false;








const oldOpenPageQR=openPage;


openPage=function(id){


oldOpenPageQR(id);



if(id==="qr"){


startQR();


}


}








async function startQR(){



if(qrRunning)return;





try{


qrScanner=new Html5Qrcode("qrReader");



await qrScanner.start(

{

facingMode:"environment"

},


{

fps:10,

qrbox:250

},


(text)=>{


readQR(text);


}


);



qrRunning=true;



}

catch(error){


stcbAlert("❌ Kamera nebyla povolena");


console.log(error);


}



}









async function readQR(text){



// QR formát:
// 569-Torunn


let data=text.split("-");





if(data.length!==2){


stcbAlert("❌ Špatný QR kód");


return;


}






let amount=Number(data[0]);

let name=data[1];







if(amount<=0){


stcbAlert("❌ Špatná částka");


return;


}








if(Number(currentClient.money)<amount){


stcbAlert("❌ Nemáš dost peněz");


return;


}








const {data:user,error}=await supabaseClient

.from("clients")

.select("*")

.eq("name",name)

.single();







if(error || !user){


stcbAlert("❌ Příjemce neexistuje");


return;


}








if(user.id===currentClient.id){


stcbAlert("❌ Nemůžeš poslat sám sobě");


return;


}








qrReceiver=user;

qrAmount=amount;







document.getElementById("qrInfo")

.innerHTML=

`

👤 Komu:
<b>${user.name}</b>

<br><br>

💰 Částka:
<b>${amount.toLocaleString("cs-CZ")} Kč</b>

<br><br>

📤 Odesílá:
<b>${currentClient.name}</b>

`;








document.getElementById("qrConfirm")

.style.display="block";







if(qrScanner){


await qrScanner.stop();


qrRunning=false;


}



}




</script>

<!-- HISTORIE -->


<div id="history" class="page">


<div class="card">


<h1>
📜 Historie plateb
</h1>


<div id="historyList">

Žádné pohyby

</div>


</div>


</div>








<script>


async function finishQR(){



let pin=document.getElementById("qrPin").value;





if(pin!==currentClient.pin){


stcbAlert("❌ Špatný PIN");


return;


}







if(Number(currentClient.money)<qrAmount){


stcbAlert("❌ Nemáš dost peněz");


return;


}







let date=new Date().toLocaleString("cs-CZ");






currentClient.money=

Number(currentClient.money)-qrAmount;



qrReceiver.money=

Number(qrReceiver.money)+qrAmount;







currentClient.history=

currentClient.history || [];



currentClient.history.push({


text:
"📤 QR platba "+qrAmount+" Kč pro "+qrReceiver.name,


date:date


});







qrReceiver.history=

qrReceiver.history || [];



qrReceiver.history.push({


text:
"📥 QR platba "+qrAmount+" Kč od "+currentClient.name,


date:date


});









await supabaseClient

.from("clients")

.update({

money:currentClient.money,

history:currentClient.history

})

.eq("id",currentClient.id);








await supabaseClient

.from("clients")

.update({

money:qrReceiver.money,

history:qrReceiver.history

})

.eq("id",qrReceiver.id);









await supabaseClient

.from("transfers")

.insert({

sender:currentClient.name,

receiver:qrReceiver.name,

amount:qrAmount,

date:date

});







stcbAlert("✅ QR platba odeslána");



updateAccount();



document.getElementById("qrConfirm")

.style.display="none";



}









function loadHistory(){



let box=document.getElementById("historyList");



if(!box || !currentClient)return;





let history=currentClient.history || [];





if(history.length===0){


box.innerHTML="Žádné pohyby";


return;


}







box.innerHTML="";






history.slice().reverse().forEach(item=>{


box.innerHTML+=`

<div class="card">

${item.text}

<br>

🕒 ${item.date}

</div>

`;



});



}









const oldUpdateAccount=updateAccount;


updateAccount=function(){


oldUpdateAccount();


loadHistory();


}









setInterval(async()=>{



if(!currentClient)return;





const {data,error}=await supabaseClient

.from("clients")

.select("*")

.eq("id",currentClient.id)

.single();





if(!error && data){


currentClient=data;


updateAccount();


}



},5000);






</script>





</div>


</body>

</html>
